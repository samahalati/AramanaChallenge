# Load balancer in front of N identical app replicas (docker compose DNS round-robin on the `app` service name).
# TLS is terminated here in production (add a `listen 443 ssl` block / use your platform's ingress); the app trusts X-Forwarded-Proto.
upstream aramana_app { zone aramana 64k; server app:8000 resolve; }
resolver 127.0.0.11 valid=5s;

server {
    listen 8080;
    client_max_body_size 1m;
    location / {
        proxy_pass http://aramana_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;     # a dead replica is skipped transparently
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
