components:
  schemas:
    Account:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          maxLength: 255
          minLength: 2
        role:
          $ref: '#/components/schemas/RoleEa8Enum'
        password:
          type: string
          writeOnly: true
          maxLength: 200
          minLength: 10
      required:
      - email
      - full_name
      - password
      - role
    AlertAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/AlertActionActionEnum'
        note:
          type: string
          nullable: true
          maxLength: 4000
        assign_to:
          type: integer
          nullable: true
      required:
      - action
    AlertActionActionEnum:
      enum:
      - start_review
      - assign
      - comment
      - request_info
      - provide_info
      - escalate
      - false_positive
      - close_no_action
      - close_substantiated
      - reopen
      type: string
      description: |-
        * `start_review` - start_review
        * `assign` - assign
        * `comment` - comment
        * `request_info` - request_info
        * `provide_info` - provide_info
        * `escalate` - escalate
        * `false_positive` - false_positive
        * `close_no_action` - close_no_action
        * `close_substantiated` - close_substantiated
        * `reopen` - reopen
    Ask:
      type: object
      properties:
        question:
          type: string
          maxLength: 300
          minLength: 3
      required:
      - question
    Assignment:
      type: object
      properties:
        supervisor_id:
          type: integer
        supervisee_id:
          type: integer
        effective_from:
          type: string
          format: date
          nullable: true
        schedule_every_days:
          type: integer
          maximum: 90
          minimum: 1
          default: 7
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - supervisee_id
      - supervisor_id
    CategoryEnum:
      enum:
      - operational
      - clinical
      - misconduct
      type: string
      description: |-
        * `operational` - operational
        * `clinical` - clinical
        * `misconduct` - misconduct
    CloseReview:
      type: object
      properties:
        monitoring_plan:
          type: string
          nullable: true
          maxLength: 1000
    Contract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 40
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        document_ref:
          type: string
          nullable: true
          maxLength: 120
      required:
      - id
      - kind
      - start_date
    CorrectiveAction:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
          minLength: 5
        due_date:
          type: string
          format: date
      required:
      - description
      - due_date
    CorrectivePatchStatusEnum:
      enum:
      - completed
      - cancelled
      type: string
      description: |-
        * `completed` - completed
        * `cancelled` - cancelled
    Credential:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 160
        number:
          type: string
          maxLength: 60
        issuer:
          type: string
          maxLength: 160
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        days_to_expiry:
          type: string
          readOnly: true
      required:
      - days_to_expiry
      - id
      - kind
      - number
      - title
    Development:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
          maxLength: 160
          minLength: 3
        provider:
          type: string
          maxLength: 160
        hours:
          type: number
          format: double
          maximum: 200
          minimum: 0.5
        completed_on:
          type: string
          format: date
      required:
      - completed_on
      - hours
      - id
      - kind
      - title
    EmploymentTypeEnum:
      enum:
      - employee
      - contractor
      - volunteer
      type: string
      description: |-
        * `employee` - employee
        * `contractor` - contractor
        * `volunteer` - volunteer
    Escalate:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          minLength: 10
      required:
      - reason
    KindEnum:
      enum:
      - training
      - course
      - conference
      - workshop
      - supervision_hours
      type: string
      description: |-
        * `training` - training
        * `course` - course
        * `conference` - conference
        * `workshop` - workshop
        * `supervision_hours` - supervision_hours
    LifecycleAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/LifecycleActionActionEnum'
        reason:
          type: string
          maxLength: 500
          minLength: 5
        effective_date:
          type: string
          format: date
          nullable: true
      required:
      - action
      - reason
    LifecycleActionActionEnum:
      enum:
      - activate
      - suspend
      - reactivate
      - terminate
      type: string
      description: |-
        * `activate` - activate
        * `suspend` - suspend
        * `reactivate` - reactivate
        * `terminate` - terminate
    Login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          maxLength: 200
      required:
      - email
      - password
    Meeting:
      type: object
      properties:
        supervisee_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
      required:
      - scheduled_at
      - supervisee_id
    MeetingPatchStatusEnum:
      enum:
      - completed
      - missed
      - scheduled
      type: string
      description: |-
        * `completed` - completed
        * `missed` - missed
        * `scheduled` - scheduled
    ModeEnum:
      enum:
      - online
      - in_person
      type: string
      description: |-
        * `online` - online
        * `in_person` - in_person
    NeedEnum:
      enum:
      - trauma
      - anxiety
      - depression
      - couples
      - child
      - addiction
      type: string
      description: |-
        * `trauma` - trauma
        * `anxiety` - anxiety
        * `depression` - depression
        * `couples` - couples
        * `child` - child
        * `addiction` - addiction
    NullEnum:
      enum:
      - null
    OutcomeEnum:
      enum:
      - approved
      - needs_changes
      type: string
      description: |-
        * `approved` - approved
        * `needs_changes` - needs_changes
    PatchedContract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 40
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        document_ref:
          type: string
          nullable: true
          maxLength: 120
    PatchedCorrectivePatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CorrectivePatchStatusEnum'
    PatchedCredential:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 160
        number:
          type: string
          maxLength: 60
        issuer:
          type: string
          maxLength: 160
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        days_to_expiry:
          type: string
          readOnly: true
    PatchedMeetingPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MeetingPatchStatusEnum'
    PatchedProfilePatch:
      type: object
      properties:
        specialization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SpecializationEnum'
          - $ref: '#/components/schemas/NullEnum'
        org_unit_id:
          type: integer
          nullable: true
        employment_type:
          $ref: '#/components/schemas/EmploymentTypeEnum'
        capacity_weekly_sessions:
          type: integer
          maximum: 60
          minimum: 0
        bio:
          type: string
          nullable: true
          maxLength: 1000
    PatchedRoleChange:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEa8Enum'
        reason:
          type: string
          maxLength: 500
          minLength: 5
    PatchedSessionPatch:
      type: object
      properties:
        scheduled_start:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SessionPatchStatusEnum'
        reported_duration_min:
          type: integer
          maximum: 300
          minimum: 0
    PatchedStatusChange:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusChangeStatusEnum'
        reason:
          type: string
          maxLength: 500
          minLength: 5
    PractitionerCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          maxLength: 255
          minLength: 2
        role:
          $ref: '#/components/schemas/PractitionerCreateRoleEnum'
        specialization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SpecializationEnum'
          - $ref: '#/components/schemas/NullEnum'
        org_unit_id:
          type: integer
          nullable: true
        employment_type:
          allOf:
          - $ref: '#/components/schemas/EmploymentTypeEnum'
          default: employee
        hire_date:
          type: string
          format: date
          nullable: true
        capacity_weekly_sessions:
          type: integer
          maximum: 60
          minimum: 0
          default: 25
        initial_password:
          type: string
          maxLength: 200
          minLength: 10
      required:
      - email
      - full_name
      - initial_password
      - role
    PractitionerCreateRoleEnum:
      enum:
      - therapist
      - assistant_counselor
      - clinical_supervisor
      type: string
      description: |-
        * `therapist` - therapist
        * `assistant_counselor` - assistant_counselor
        * `clinical_supervisor` - clinical_supervisor
    QualityIssue:
      type: object
      properties:
        practitioner_id:
          type: integer
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title:
          type: string
          maxLength: 200
          minLength: 5
        detail:
          type: string
          nullable: true
          maxLength: 2000
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          default: medium
      required:
