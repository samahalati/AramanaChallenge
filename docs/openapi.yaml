components:
  schemas:
    Contract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 40
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        document_ref:
          type: string
          nullable: true
          maxLength: 120
      required:
      - id
      - kind
      - start_date
    Credential:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 160
        number:
          type: string
          maxLength: 60
        issuer:
          type: string
          maxLength: 160
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        days_to_expiry:
          type: string
          readOnly: true
      required:
      - days_to_expiry
      - id
      - kind
      - number
      - title
    PatchedContract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 40
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        document_ref:
          type: string
          nullable: true
          maxLength: 120
    PatchedCredential:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 160
        number:
          type: string
          maxLength: 60
        issuer:
          type: string
          maxLength: 160
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        status:
          type: string
          maxLength: 20
        days_to_expiry:
          type: string
          readOnly: true
