name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  backend:                       # tests + consistency checks on the default (SQLite) database
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.11", "3.12", "3.13"]}}
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt ruff
      - run: ruff check . --select F,E9                         # real errors only (undefined names, syntax, unused imports)
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run   # models and migrations agree
      - run: python -m pytest -q
      - run: python manage.py evaluate                           # detection quality vs the synthetic ground truth
      - run: python manage.py evaluate_llm                       # deterministic guardrail red-team (no network)
      - name: Generated docs are up to date                      # openapi.yaml / RBAC_MATRIX.md must match the code
        run: python manage.py export_docs && git diff --exit-code -- ../docs/openapi.yaml ../docs/RBAC_MATRIX.md

  postgres:                      # the same tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: {POSTGRES_USER: aramana, POSTGRES_PASSWORD: aramana, POSTGRES_DB: aramana}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aramana" --health-interval 3s --health-timeout 3s --health-retries 20
    env: {DATABASE_URL: "postgres://aramana:aramana@localhost:5432/aramana"}
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python manage.py migrate -v0 && python manage.py seed_demo --detect > /dev/null && python manage.py evaluate
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run check:i18n                                  # every UI string has a Persian translation
      - run: npm run build

  docker:                        # the shipped image builds and answers
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aramana .
      - run: |
          docker run -d --name app -p 8000:8000 aramana
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break || sleep 2; done
          curl -fs -o /dev/null localhost:8000/ && curl -fs -o /dev/null localhost:8000/api/docs/
          curl -fsI localhost:8000/ | grep -i "x-frame-options: DENY"
